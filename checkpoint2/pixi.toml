[workspace]
name = "biostat707-checkpoint2"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = "*"
numpy = "*"
scipy = "*"
scikit-learn = "*"
matplotlib = "*"
pygam = "*"
jupyter_core = "*"
nbclient = "*"
nbconvert = "*"
nbformat = "*"
ipykernel = "*"

[tasks]
checkpoint2 = "jupyter nbconvert --to html --execute checkpoint2.ipynb --output-dir output --ExecutePreprocessor.timeout=1800"
