[workspace]
name = "biostat707"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = "*"
numpy = "*"
scipy = "*"
scikit-learn = "*"
matplotlib = "*"
pygam = "*"
jupyter_core = "*"
nbclient = "*"
nbconvert = "*"
nbformat = "*"
ipykernel = "*"
statsmodels = ">=0.15.0,<0.16"
shap = ">=0.50.0,<0.53"

[tasks]
checkpoint3 = { cmd = "python build_report.py", cwd = "checkpoint3" }
