[workspace]
name = "biostat707"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = "*"
numpy = "*"
scipy = "*"
scikit-learn = "*"
matplotlib = "*"
pygam = "*"
jupyter_core = "*"
nbclient = "*"
nbconvert = "*"
nbformat = "*"
ipykernel = "*"
statsmodels = ">=0.15.0,<0.16"
shap = ">=0.50.0,<0.53"

[tasks]
# Each task can be run from the repository root with data/ placed at the root.
# Checkpoint 1 needs packages (seaborn, missingno, tableone) that are not in this environment,
# so it runs in its own locked environment in checkpoint1/.
checkpoint1 = { cmd = "pixi run --locked --manifest-path pixi.toml checkpoint1", cwd = "checkpoint1" }
# The packages in checkpoint2/pixi.lock are all in this lock file at the same versions.
checkpoint2 = { cmd = "python build_report.py", cwd = "checkpoint2" }
checkpoint3 = { cmd = "python build_report.py", cwd = "checkpoint3" }
